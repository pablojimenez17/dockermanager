apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockermanager-ingress
  namespace: dockermanager
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Sticky sessions para Socket.IO (WebSockets) — el mismo cliente siempre al mismo pod
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"

    # WebSocket upgrade para Socket.IO
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # Aumentar límites para uploads/snapshots
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"

    # Timeouts para deploys lentos y llamadas de IA
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

    # Redirigir HTTP → HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - orbitcloud.app
    - www.orbitcloud.app
    secretName: dockermanager-tls
  rules:
  - host: orbitcloud.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: dockermanager-backend
            port:
              number: 5000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: dockermanager-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dockermanager-frontend
            port:
              number: 80
  - host: www.orbitcloud.app
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: dockermanager-backend
            port:
              number: 5000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: dockermanager-backend
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dockermanager-frontend
            port:
              number: 80
