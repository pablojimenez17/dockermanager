apiVersion: v1
kind: Service
metadata:
  name: dockermanager-minio
  namespace: dockermanager
spec:
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: dockermanager-minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dockermanager-minio
  namespace: dockermanager
spec:
  serviceName: dockermanager-minio
  replicas: 1
  selector:
    matchLabels:
      app: dockermanager-minio
  template:
    metadata:
      labels:
        app: dockermanager-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
        - server
        - /data
        - --console-address
        - :9001
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: MINIO_ROOT_PASSWORD
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - name: minio-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "local-path" # k3s default storage class
      resources:
        requests:
          storage: 10Gi
