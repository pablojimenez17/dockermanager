apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockermanager-backend
  namespace: dockermanager
  labels:
    app: dockermanager-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dockermanager-backend
  template:
    metadata:
      labels:
        app: dockermanager-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dockermanager-backend
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: backend
        image: dockermanager/backend:latest # Reemplazar con la URL del registro (e.g. registry.digitalocean.com/...)
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: dockermanager-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: JWT_SECRET
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: GEMINI_API_KEY
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: SENDGRID_API_KEY
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dockermanager-secrets
              key: MINIO_ROOT_PASSWORD
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
