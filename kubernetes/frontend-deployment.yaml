apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockermanager-frontend
  namespace: dockermanager
  labels:
    app: dockermanager-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # Nunca baja una réplica antes de que la nueva esté lista
  selector:
    matchLabels:
      app: dockermanager-frontend
  template:
    metadata:
      labels:
        app: dockermanager-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dockermanager-frontend
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: frontend
        image: ghcr.io/pablojimenez17/dockermanager-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
