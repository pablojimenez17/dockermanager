apiVersion: v1
kind: Service
metadata:
  name: dockermanager-socket-proxy
  namespace: dockermanager
spec:
  ports:
  - port: 2375
    targetPort: 2375
    name: tcp
  selector:
    app: dockermanager-socket-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockermanager-socket-proxy
  namespace: dockermanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dockermanager-socket-proxy
  template:
    metadata:
      labels:
        app: dockermanager-socket-proxy
    spec:
      containers:
      - name: socket-proxy
        image: tecnativa/docker-socket-proxy:latest
        ports:
        - containerPort: 2375
          name: tcp
        env:
        - name: CONTAINERS
          value: "1"
        - name: IMAGES
          value: "1"
        - name: NETWORKS
          value: "1"
        - name: VOLUMES
          value: "1"
        - name: EXEC
          value: "1"
        - name: BUILD
          value: "1"
        - name: COMMIT
          value: "1"
        - name: EVENTS
          value: "1"
        - name: POST
          value: "1"
        - name: DELETE
          value: "1"
        - name: SYSTEM
          value: "1"
        - name: INFO
          value: "1"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          privileged: true
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
          readOnly: true
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
